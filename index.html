      var tick = function () {
        var left = promo.end - Date.now();
        if (left <= 0) { bar.style.display = "none"; card.style.display = "none"; clearInterval(timer); return; }
        var d = Math.floor(left / 864e5), hr = Math.floor(left % 864e5 / 36e5),
            mi = Math.floor(left % 36e5 / 6e4), se = Math.floor(left % 6e4 / 1e3);
        var t = (d ? d + "d " : "") + hr + "h " + mi + "m " + se + "s";
        each(".cd", function (el) { el.textContent = t; });
      };
      tick(); timer = setInterval(tick, 1000);
    }
  }

  /* ---------- wire up buttons and tracking ---------- */
  each("a.wa", function (a) {
    a.href = waUrl(a.getAttribute("data-msg")); a.target = "_blank"; a.rel = "noopener";
    var svc = a.getAttribute("data-svc");
    a.addEventListener("click", function () { track("Lead", { content_name: svc }); });
  });
  each("a.paynow", function (a) {
    a.href = payUrl; a.rel = "noopener";
    a.addEventListener("click", function () {
      track("InitiateCheckout", { value: O.purchaseValue, currency: C.currencyCode });
    });
  });
})();
</script>
</body>
</html>
