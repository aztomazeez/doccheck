  if (O.services && O.services.length) {
    h += '<section><div class="wrap">' + eyebrow(O.servicesEyebrow) + '<h2>' + esc(fill(O.servicesTitle)) + '</h2><div class="sp"></div><div class="cards">';
    for (i = 0; i < O.services.length; i++) {
      var s = O.services[i];
      h += '<div class="card' + (s.rec ? ' rec' : '') + '"><div class="ihead"><span class="ibox">' + ic(s.icon) + '</span>' +
           (s.tag ? '<span class="tag">' + esc(s.tag) + '</span>' : '') + '</div>' +
           '<h3>' + esc(fill(s.title)) + '</h3><p>' + esc(fill(s.text)) + '</p><ul>';
      for (j = 0; j < s.bullets.length; j++) h += '<li>' + esc(fill(s.bullets[j])) + '</li>';
      h += '</ul>' + waBtn(s.button, 'small', s.ask, s.title) + '</div>';
    }
    h += '</div></div></section>';
  }

  /* what we look for */
  if (O.look && O.look.length) {
    h += '<section class="soft"><div class="wrap">' + eyebrow(O.lookEyebrow) + '<h2>' + esc(fill(O.lookTitle)) + '</h2>';
    if (O.lookText) h += '<p class="lead">' + esc(fill(O.lookText)) + '</p>';
    h += '<div class="look">';
    for (i = 0; i < O.look.length; i++) {
      var l = O.look[i];
      h += '<div class="lk"><span class="ibox">' + ic(l.icon) + '</span><div><h3>' + esc(fill(l.title)) + '</h3><p>' + esc(fill(l.text)) + '</p></div></div>';
    }
    h += '</div>' + waBtn(O.cta.quote) + '</div></section>';
  }

  /* how it works */
  h += '<section><div class="wrap">' + eyebrow(O.stepsEyebrow) + '<h2>' + esc(fill(O.stepsTitle)) + '</h2><div class="sp"></div><ol class="steps">';
  for (i = 0; i < O.steps.length; i++) {
    h += '<li>' + rich(O.steps[i]);
    if (payUrl && O.payStep === i + 1) {
      h += '<div class="pay"><a class="btn navy small paynow" href="#">' + esc(payText) + '</a>' +
           (O.payStepNote ? '<small>' + esc(fill(O.payStepNote)) + '</small>' : '') + '</div>';
    }
    h += '</li>';
  }
  h += '</ol>';
  if (O.stepsFoot) h += '<p class="foot">' + esc(fill(O.stepsFoot)) + '</p>';
  h += '</div></section>';

  /* what to send */
  if (O.send && O.send.length) {
    h += '<section class="soft"><div class="wrap">' + eyebrow(O.sendEyebrow) + '<h2>' + esc(fill(O.sendTitle)) + '</h2><div class="sp"></div><ul class="send">';
    for (i = 0; i < O.send.length; i++) h += '<li><span>' + rich(O.send[i]) + '</span></li>';
    h += '</ul>';
    if (O.sendNote) h += '<p class="foot">' + esc(fill(O.sendNote)) + '</p>';
    h += waBtn(O.cta.main) + '</div></section>';
  }

  /* confidentiality */
  if (O.confTitle) {
    h += '<section class="conf"><div class="wrap"><div class="big">' + ic('lock') + '</div><h2>' + esc(fill(O.confTitle)) + '</h2><p>' + esc(fill(O.confText)) + '</p>';
    if (O.conf && O.conf.length) { h += '<ul>'; for (i = 0; i < O.conf.length; i++) h += '<li>' + esc(fill(O.conf[i])) + '</li>'; h += '</ul>'; }
    h += '</div></section>';
  }

  /* scope */
  if (O.scopeTitle) {
    h += '<section><div class="wrap">' + eyebrow(O.scopeEyebrow) + '<h2>' + esc(fill(O.scopeTitle)) + '</h2><div class="sp"></div><div class="scope">';
    h += '<div class="do"><h3>' + esc(O.scopeDoTitle) + '</h3><ul>';
    for (i = 0; i < O.scopeDo.length; i++) h += '<li>' + esc(fill(O.scopeDo[i])) + '</li>';
    h += '</ul></div><div class="dont"><h3>' + esc(O.scopeDontTitle) + '</h3><ul>';
    for (i = 0; i < O.scopeDont.length; i++) h += '<li>' + esc(fill(O.scopeDont[i])) + '</li>';
    h += '</ul></div></div>';
    if (O.scopeNote) h += '<p class="foot">' + esc(fill(O.scopeNote)) + '</p>';
    h += '</div></section>';
  }

  /* fields and documents */
  if ((O.fields && O.fields.length) || (O.docs && O.docs.length)) {
    h += '<section class="soft"><div class="wrap">';
    if (O.fields && O.fields.length) {
      h += eyebrow(O.fieldsEyebrow) + '<h2>' + esc(fill(O.fieldsTitle)) + '</h2><div class="sp"></div><div class="chips">';
      for (i = 0; i < O.fields.length; i++) h += '<span class="chip">' + esc(fill(O.fields[i])) + '</span>';
      h += '</div><div class="sp"></div><div class="sp"></div>';
    }
    if (O.docs && O.docs.length) {
      h += '<h2>' + esc(fill(O.docsTitle)) + '</h2><div class="sp"></div><div class="chips alt">';
      for (i = 0; i < O.docs.length; i++) h += '<span class="chip">' + esc(fill(O.docs[i])) + '</span>';
      h += '</div>';
      if (O.docsNote) h += '<p class="foot">' + esc(fill(O.docsNote)) + '</p>';
    }
    h += '</div></section>';
  }

  /* price */
  h += '<section><div class="wrap">' + eyebrow(O.priceEyebrow) + '<div class="pricebox">';
  h += '<div class="plabel">' + esc(fill(O.priceLabel)) + '</div>';
  h += '<div class="pvalue">' + esc(fill(O.priceValue)) + '</div>';
  if (O.priceNote) h += '<p class="pnote">' + esc(fill(O.priceNote)) + '</p>';
  if (O.showPriceGuide && O.priceGuide && O.priceGuide.length) {
    h += '<table class="guide">';
    for (i = 0; i < O.priceGuide.length; i++)
      h += '<tr><td>' + esc(fill(O.priceGuide[i].label)) + '</td><td>' + esc(fill(O.priceGuide[i].price)) + '</td></tr>';
    h += '</table>';
  }
  h += '<div id="promoCard"></div>';
  h += waBtn(O.cta.quote);
  h += '</div></div></section>';

  /* testimonials */
  if (C.testimonials && C.testimonials.length) {
    h += '<section class="soft"><div class="wrap"><h2>What customers say</h2><div class="sp"></div>';
    for (i = 0; i < C.testimonials.length; i++)
      h += '<div class="quote">\u201C' + esc(C.testimonials[i].text) + '\u201D<b>' + esc(C.testimonials[i].name) + '</b></div>';
    h += '</div></section>';
  }

  /* faq */
  if (O.faq && O.faq.length) {
    h += '<section' + ((C.testimonials && C.testimonials.length) ? '' : ' class="soft"') + '><div class="wrap">' + eyebrow(O.faqEyebrow) + '<h2>' + esc(fill(O.faqTitle)) + '</h2><div class="sp"></div>';
    for (i = 0; i < O.faq.length; i++)
      h += '<details><summary>' + esc(fill(O.faq[i].q)) + '</summary><p>' + rich(O.faq[i].a) + '</p></details>';
    h += waBtn(O.cta.ask) + '</div></section>';
  }

  /* final */
  h += '<section class="final"><div class="wrap"><h2>' + esc(fill(O.finalTitle)) + '</h2><p>' + esc(fill(O.finalText)) + '</p>';
  h += waBtn(O.cta.main);
  if (payUrl) h += '<p class="payline">Already have your quote? <a class="paynow" href="#">' + esc(payText) + '</a></p>';
  h += '</div></section>';

  h += '<footer><div class="wrap"><div class="logo">' + LOGO.replace('fill="#fff"','fill="#0b1f4b"') + '<span>DocCheck <b style="color:#0f7a63">Pro</b></span></div><p>&copy; ' + esc(C.brandName) + '. ' + esc(fill(O.disclaimer)) + '</p></div></footer>';

  document.getElementById("app").innerHTML = h;
  document.getElementById("sticky").innerHTML = waBtn(O.cta.main);

  /* ---------- promo display ---------- */
  if (promo) {
    var bar = document.getElementById("promoBar"), card = document.getElementById("promoCard");
    bar.innerHTML = promo.html ? promo.bar : esc(promo.bar);
    bar.style.display = "block";
    card.innerHTML = rich(promo.card).replace(/&lt;span class='cd'&gt;&lt;\/span&gt;/g, "<span class='cd'></span>");
    card.style.display = "block";
    if (promo.end) {
      var tick = function () {
        var left = promo.end - Date.now();
        if (left <= 0) { bar.style.display = "none"; card.style.display = "none"; clearInterval(timer); return; }
        var d = Math.floor(left / 864e5), hr = Math.floor(left % 864e5 / 36e5),
            mi = Math.floor(left % 36e5 / 6e4), se = Math.floor(left % 6e4 / 1e3);
        var t = (d ? d + "d " : "") + hr + "h " + mi + "m " + se + "s";
        each(".cd", function (el) { el.textContent = t; });
      };
      tick(); timer = setInterval(tick, 1000);
    }
  }

  /* ---------- wire up buttons and tracking ---------- */
  each("a.wa", function (a) {
    a.href = waUrl(a.getAttribute("data-ask")); a.target = "_blank"; a.rel = "noopener";
    var svc = a.getAttribute("data-svc");
    a.addEventListener("click", function () { track("Lead", { content_name: svc }); });
  });
  each("a.paynow", function (a) {
    a.href = payUrl; a.rel = "noopener";
    a.addEventListener("click", function () {
      track("InitiateCheckout", { value: O.purchaseValue, currency: C.currencyCode });
    });
  });
  each(".logo", function(a){ if (a.tagName === "A") a.addEventListener("click", function(e){ e.preventDefault(); window.scrollTo(0,0); }); });
})();
</script>
</body>
</html>
