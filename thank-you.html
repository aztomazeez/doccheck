<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you</title>
<meta name="robots" content="noindex">
<script src="config.js" charset="utf-8"></script>
<script>
/* Meta Pixel + Purchase event (fires once per payment, only on this page) */
if (CONFIG.pixelId && CONFIG.pixelId.indexOf("PASTE") === -1) {
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', CONFIG.pixelId);
  fbq('track', 'PageView');
  (function () {
    var O = CONFIG.offer;
    var q = new URLSearchParams(location.search);
    var id = q.get("transaction_id") || q.get("tx_ref") || q.get("reference") || q.get("trxref") || "";
    var key = "purchase_sent_" + (id || "session");
    var seen = false;
    try { seen = !!(id ? localStorage.getItem(key) : sessionStorage.getItem(key)); } catch (e) {}
    if (!seen) {
      fbq('track', 'Purchase', { value: O.purchaseValue, currency: CONFIG.currencyCode });
      try { (id ? localStorage : sessionStorage).setItem(key, "1"); } catch (e) {}
    }
  })();
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1b2430;background:#f3f6fa;line-height:1.55;font-size:17px;text-align:center;padding:40px 18px}
.card{max-width:520px;margin:0 auto;background:#fff;border-radius:18px;padding:32px 22px;border:1px solid #e4e9f0}
.tick{width:72px;height:72px;border-radius:50%;background:#0f7a63;color:#fff;font-size:40px;line-height:72px;margin:0 auto 14px}
h1{font-size:26px;margin-bottom:12px}
p{margin-bottom:14px;color:#5a6578}
.btn{display:block;max-width:420px;margin:20px auto 6px;padding:16px 14px;border-radius:14px;background:#0f7a63;color:#fff;font-size:19px;font-weight:800;text-decoration:none;box-shadow:0 4px 0 #0a5c4a}
</style>
</head>
<body>
<div class="card">
  <div class="tick">&#10003;</div>
  <h1 id="t"></h1>
  <p id="x"></p>
  <a class="btn" id="b" href="#"></a>
</div>
<script>
var O = CONFIG.offer;
function fill(s){ return String(s).replace(/\{turnaround\}/g,function(){return O.turnaround}).replace(/\{price\}/g,function(){return O.priceValue}).replace(/\{brand\}/g,function(){return CONFIG.brandName}); }
document.getElementById("t").textContent = fill(O.thankYouTitle);
document.getElementById("x").textContent = fill(O.thankYouText);
var b = document.getElementById("b");
b.textContent = fill(O.thankYouButton);
b.href = "https://wa.me/" + CONFIG.whatsappNumber + "?text=" + encodeURIComponent(fill(O.thankYouWhatsappMessage));
</script>
</body>
</html>
